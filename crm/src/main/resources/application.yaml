spring:
  application:
    name: crm

  datasource:
    url: jdbc:postgresql://localhost:5432/crmaster
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect